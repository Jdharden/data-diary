<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Courier New, Courier, monospace">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f4e6"/>
      <stop offset="100%" stop-color="#f3ecd9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="720" fill="#e9dfc7"/>

  <!-- window chrome -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="1120" height="640" rx="10" fill="url(#paper)" stroke="#1f1b16" stroke-width="1.5"/>
    <rect x="40" y="40" width="1120" height="32" rx="10" fill="#e7dec6" stroke="#1f1b16" stroke-width="1.5"/>
    <circle cx="64" cy="56" r="6" fill="#8a3324"/>
    <circle cx="84" cy="56" r="6" fill="#c19a3a"/>
    <circle cx="104" cy="56" r="6" fill="#5a7a3a"/>
    <text x="600" y="60" text-anchor="middle" font-size="13" fill="#5a4f42">Data Diary</text>
  </g>

  <!-- column dividers -->
  <line x1="288" y1="72" x2="288" y2="680" stroke="#d9cfb9" stroke-width="1"/>
  <line x1="900" y1="72" x2="900" y2="680" stroke="#d9cfb9" stroke-width="1"/>

  <!-- ============ LEFT: PROJECTS ============ -->
  <g font-size="13" fill="#1f1b16">
    <text x="60" y="100" font-size="11" letter-spacing="2" fill="#5a4f42">PROJECTS</text>
    <rect x="245" y="86" width="22" height="22" rx="2" fill="#efe8d8" stroke="#d9cfb9"/>
    <text x="256" y="103" text-anchor="middle" font-size="16" fill="#1f1b16">+</text>

    <!-- search row -->
    <rect x="58" y="120" width="160" height="24" rx="2" fill="none" stroke="#d9cfb9"/>
    <text x="66" y="137" font-size="12" fill="#8b7f6e">search…</text>
    <rect x="224" y="120" width="48" height="24" rx="2" fill="none" stroke="#d9cfb9"/>
    <text x="232" y="137" font-size="12" fill="#1f1b16">recent</text>

    <!-- project: ACTIVE -->
    <rect x="58" y="156" width="216" height="48" fill="#f9f4e6"/>
    <rect x="58" y="156" width="3" height="48" fill="#8a3324"/>
    <text x="70" y="174" font-weight="700">Sales pipeline analysis</text>
    <text x="70" y="192" font-size="11" fill="#8b7f6e">2026-05-27  ·  3 entries  ·  2/5 todo</text>

    <!-- project 2 -->
    <text x="58" y="226" font-weight="700">Cohort retention v2</text>
    <text x="58" y="244" font-size="11" fill="#8b7f6e">2026-05-26  ·  6 entries  ·  4/4 todo</text>

    <!-- project 3 -->
    <text x="58" y="278" font-weight="700">Customer segment model</text>
    <text x="58" y="296" font-size="11" fill="#8b7f6e">2026-05-24  ·  2 entries  ·  0/3 todo</text>

    <!-- project 4 -->
    <text x="58" y="330" font-weight="700">Churn signals — sandbox</text>
    <text x="58" y="348" font-size="11" fill="#8b7f6e">2026-05-20  ·  9 entries</text>

    <!-- project 5 -->
    <text x="58" y="382" font-weight="700">Q1 board metrics</text>
    <text x="58" y="400" font-size="11" fill="#8b7f6e">2026-05-15  ·  4 entries  ·  1/2 todo</text>
  </g>
  <!-- dotted dividers between projects -->
  <line x1="58" y1="212" x2="270" y2="212" stroke="#d9cfb9" stroke-dasharray="2 3"/>
  <line x1="58" y1="262" x2="270" y2="262" stroke="#d9cfb9" stroke-dasharray="2 3"/>
  <line x1="58" y1="316" x2="270" y2="316" stroke="#d9cfb9" stroke-dasharray="2 3"/>
  <line x1="58" y1="368" x2="270" y2="368" stroke="#d9cfb9" stroke-dasharray="2 3"/>

  <!-- footer of sidebar -->
  <line x1="58" y1="640" x2="270" y2="640" stroke="#d9cfb9"/>
  <text x="58" y="658" font-size="11" fill="#5a4f42">↺ change folder</text>
  <text x="58" y="672" font-size="9.5" fill="#8b7f6e">~/Documents/Data Diary</text>

  <!-- ============ CENTER: EDITOR ============ -->
  <g font-size="13">
    <!-- header -->
    <text x="312" y="106" font-size="20" font-weight="700" fill="#1f1b16">Sales pipeline analysis</text>
    <text x="780" y="106" font-size="11" fill="#8b7f6e">saved 2026-05-27</text>
    <rect x="822" y="92" width="62" height="22" rx="2" fill="#efe8d8" stroke="#d9cfb9"/>
    <text x="853" y="107" text-anchor="middle" font-size="11" fill="#1f1b16">+ entry</text>
    <line x1="288" y1="124" x2="900" y2="124" stroke="#d9cfb9"/>

    <!-- ENTRY 1 -->
    <rect x="312" y="142" width="572" height="148" fill="#fbf6e9" stroke="#d9cfb9"/>
    <rect x="312" y="142" width="572" height="26" fill="rgba(0,0,0,0.02)"/>
    <line x1="312" y1="168" x2="884" y2="168" stroke="#d9cfb9" stroke-dasharray="2 3"/>
    <text x="322" y="160" font-weight="700">2026-05-27 14:00 — model gap shrinks</text>
    <text x="868" y="160" font-size="14" fill="#8b7f6e">×</text>

    <text x="322" y="190" fill="#1f1b16">Re-ran the regression after dropping</text>
    <text x="322" y="208" fill="#1f1b16">the duplicate accounts. Q2 gap dropped</text>
    <text x="322" y="226" fill="#1f1b16">from 18% to 6%. Next: validate on the</text>
    <text x="322" y="244" fill="#1f1b16">held-out month before sharing with</text>
    <text x="322" y="262" fill="#1f1b16">Sarah. See artifacts/q2_residuals.csv.</text>

    <!-- ENTRY 2 -->
    <rect x="312" y="306" width="572" height="148" fill="#fbf6e9" stroke="#d9cfb9"/>
    <rect x="312" y="306" width="572" height="26" fill="rgba(0,0,0,0.02)"/>
    <line x1="312" y1="332" x2="884" y2="332" stroke="#d9cfb9" stroke-dasharray="2 3"/>
    <text x="322" y="324" font-weight="700">2026-05-27 10:14 — first look</text>

    <text x="322" y="354" fill="#1f1b16">Pulled the data. The Q2 spike looks</text>
    <text x="322" y="372" fill="#1f1b16">like an artifact of double-counted</text>
    <text x="322" y="390" fill="#1f1b16">enterprise renewals. Need to verify</text>
    <text x="322" y="408" fill="#1f1b16">with the raw event log.</text>
    <text x="322" y="426" font-style="italic" fill="#5a4f42">```r</text>
    <text x="322" y="442" font-style="italic" fill="#5a4f42">df &lt;- read_csv("artifacts/raw_data.csv")</text>

    <!-- ENTRY 3 (partial) -->
    <rect x="312" y="470" width="572" height="80" fill="#fbf6e9" stroke="#d9cfb9"/>
    <rect x="312" y="470" width="572" height="26" fill="rgba(0,0,0,0.02)"/>
    <line x1="312" y1="496" x2="884" y2="496" stroke="#d9cfb9" stroke-dasharray="2 3"/>
    <text x="322" y="488" font-weight="700">2026-05-26 17:30 — kickoff notes</text>
    <text x="322" y="518" fill="#1f1b16">Met with Sarah. Goal: ID the leakage</text>
    <text x="322" y="536" fill="#1f1b16">in the Q2 forecast.</text>
  </g>

  <!-- ============ RIGHT MARGIN ============ -->
  <g font-size="13">
    <text x="918" y="100" font-size="11" letter-spacing="2" fill="#5a4f42">TO-DO</text>
    <text x="876" y="100" font-size="11" fill="#8b7f6e" text-anchor="end" x="1142">2/5</text>

    <!-- todos -->
    <g transform="translate(918,118)">
      <rect width="14" height="14" fill="#1f1b16"/>
      <text x="22" y="11" fill="#8b7f6e" text-decoration="line-through">Pull Q1 close rates</text>
    </g>
    <g transform="translate(918,144)">
      <rect width="14" height="14" fill="#1f1b16"/>
      <text x="22" y="11" fill="#8b7f6e" text-decoration="line-through">Drop duplicate accounts</text>
    </g>
    <g transform="translate(918,170)">
      <rect width="14" height="14" fill="none" stroke="#1f1b16"/>
      <text x="22" y="11">Validate on held-out month</text>
    </g>
    <g transform="translate(918,196)">
      <rect width="14" height="14" fill="none" stroke="#1f1b16"/>
      <text x="22" y="11">Re-check Q2 enterprise tier</text>
    </g>
    <g transform="translate(918,222)">
      <rect width="14" height="14" fill="none" stroke="#1f1b16"/>
      <text x="22" y="11">Share findings with Sarah</text>
    </g>

    <rect x="918" y="252" width="224" height="22" fill="none" stroke="#d9cfb9"/>
    <text x="926" y="268" font-size="12" fill="#8b7f6e">add task…</text>

    <line x1="918" y1="298" x2="1142" y2="298" stroke="#d9cfb9"/>

    <!-- artifacts -->
    <text x="918" y="324" font-size="11" letter-spacing="2" fill="#5a4f42">ARTIFACTS</text>

    <g transform="translate(918,342)">
      <text x="0" y="11" font-size="10" fill="#8b7f6e">file</text>
      <text x="32" y="11">raw_data.csv</text>
      <text x="216" y="11" fill="#8b7f6e">×</text>
    </g>
    <g transform="translate(918,366)">
      <text x="0" y="11" font-size="10" fill="#8b7f6e">file</text>
      <text x="32" y="11">q2_residuals.csv</text>
      <text x="216" y="11" fill="#8b7f6e">×</text>
    </g>
    <g transform="translate(918,390)">
      <text x="0" y="11" font-size="10" fill="#8b7f6e">file</text>
      <text x="32" y="11">methodology.pdf</text>
      <text x="216" y="11" fill="#8b7f6e">×</text>
    </g>
    <g transform="translate(918,414)">
      <text x="0" y="11" font-size="10" fill="#8b7f6e">link</text>
      <text x="32" y="11">Forecast model docs</text>
      <text x="216" y="11" fill="#8b7f6e">×</text>
    </g>

    <rect x="918" y="438" width="50" height="22" fill="#efe8d8" stroke="#d9cfb9"/>
    <text x="943" y="453" text-anchor="middle" font-size="11">+ file</text>
    <rect x="974" y="438" width="50" height="22" fill="#efe8d8" stroke="#d9cfb9"/>
    <text x="999" y="453" text-anchor="middle" font-size="11">+ link</text>
  </g>

  <!-- subtle red typewriter-ribbon stripe at bottom for flavor -->
  <rect x="40" y="676" width="1120" height="4" fill="#8a3324" opacity="0.7"/>
</svg>
